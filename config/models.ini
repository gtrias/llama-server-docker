# llama-server curated model presets
# Only models listed here should be exposed when models-dir discovery is disabled.
#
# Auto-download: Add hf-repo and hf-file to enable automatic downloading.
# The entrypoint will download missing models before starting the server.

[qwen36-apex]
# APEX I-Compact for Qwen 3.6 — better fit for 24GB VRAM than Quality tier.
# 17.3 GB + mmproj, leaves more room for KV cache.
# Ref: https://huggingface.co/mudler/Qwen3.6-35B-A3B-APEX-GGUF
alias = qwen36-apex
model = /root/.cache/llama.cpp/Qwen3.6-35B-A3B-APEX-I-Compact.gguf
hf-repo = mudler/Qwen3.6-35B-A3B-APEX-GGUF
hf-file = Qwen3.6-35B-A3B-APEX-I-Compact.gguf
mmproj = /root/.cache/llama.cpp/mmproj.gguf
mmproj-hf-file = mmproj.gguf
no-mmproj-offload = true
ctx-size = 262144
n-gpu-layers = -1
flash-attn = on
cache-type-k = q8_0
cache-type-v = f16
temp = 1.0
top-p = 0.95
top-k = 20
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 2
kv-unified = 1

