# llama-server curated model presets
# Only models listed here should be exposed when models-dir discovery is disabled.
#
# Auto-download: Add hf-repo and hf-file to enable automatic downloading.
# The entrypoint will download missing models before starting the server.

[gemma4-26b]
# Unsloth UD-Q4_K_M — April 11+ release with Google's updated chat template
# Native template handles tool calling correctly, no custom jinja needed
alias = gemma4-26b
model = /root/.cache/llama.cpp/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
hf-repo = unsloth/gemma-4-26B-A4B-it-GGUF
hf-file = gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 40
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[gemma4-31b]
# Unsloth Q4_K_M — April 11+ release, 20.1GB VRAM on RTX 3090
# Native template handles tool calling correctly, no custom jinja needed
alias = gemma4-31b
model = /root/.cache/llama.cpp/gemma-4-31B-it-Q4_K_M.gguf
hf-repo = unsloth/gemma-4-31B-it-GGUF
hf-file = gemma-4-31B-it-Q4_K_M.gguf
mmproj = /root/.cache/llama.cpp/mmproj-31b-BF16.gguf
mmproj-hf-file = mmproj-BF16.gguf
no-mmproj-offload = true
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 40
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-35b-a3b-mtp]
# Qwen3.6 35B-A3B MoE with MTP — 256 experts × 8 active (~3B active params).
# DeltaNet hybrid (3 DeltaNet + 1 standard attention per block, same as 27B).
# MTP head is baked into the GGUF, no separate drafter.
# Ref: https://unsloth.ai/docs/models/qwen3.6#llama.cpp-mtp-guide
# GGUF: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF
alias = qwen36-35b-a3b-mtp
model = /root/.cache/llama.cpp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
hf-repo = unsloth/Qwen3.6-35B-A3B-MTP-GGUF
hf-file = Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
# mmproj disabled — frees ~1 GB CUDA0 to allow ctx-size > 32k.
# Use qwen36-27b-mtp for vision+MTP instead.
# mmproj = /root/.cache/llama.cpp/mmproj-35b-a3b-F16.gguf
# mmproj-hf-file = mmproj-F16.gguf
# no-mmproj-offload = true
# MTP speculative decoding (Unsloth 2026-05 recipe).
spec-type = draft-mtp
spec-draft-n-max = 6
spec-draft-p-min = 0.75
# Prefill tuning — smaller than dense models because MTP draft + 35B
# MoE weights leave little headroom for compute pp buffers (each MiB
# of ubatch ≈ ~1 MiB of CUDA0 compute buffer for the MTP draft).
# 4096/2048 OOMs the draft prefill at 24GB; 1024/512 fits.
batch-size = 1024
ubatch-size = 512
threads-batch = 16
# Route <think> tags to reasoning_content so clients that support it
# (pi) can render/filter them properly instead of showing raw tags.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
# VRAM on 24GB 3090 (measured 2026-06): weights ~19.5 GB + MTP draft KV
# + main DeltaNet KV (q4_0) + compute pp buffer ≈ 23.2 GB at ctx=131072
# WITHOUT mmproj (~878 MiB free). With mmproj-F16 (~1 GB), only 32k fits
# — that allocation is what historically OOM'd at 65536. Restoring vision
# on this preset would require dropping ctx back to ≤32k or switching
# quant to UD-Q2_K_XL (~11 GB). Use qwen36-27b-mtp for vision+MTP.
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
# Unsloth "general tasks" sampler defaults. For reasoning/thinking mode,
# they recommend temp=1.0 top-p=0.95 instead.
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-27b]
# Qwen3.6 27B dense — DeltaNet architecture, vision+reasoning.
# Ref: https://huggingface.co/Qwen/Qwen3.6-27B
# GGUF: https://huggingface.co/unsloth/Qwen3.6-27B-GGUF
# Recommended settings: https://huggingface.co/Qwen/Qwen3.6-27B#best-practices
alias = qwen36-27b
model = /root/.cache/llama.cpp/Qwen3.6-27B-Q4_K_M.gguf
hf-repo = unsloth/Qwen3.6-27B-GGUF
hf-file = Qwen3.6-27B-Q4_K_M.gguf
mmproj = /root/.cache/llama.cpp/mmproj-27b-BF16.gguf
mmproj-hf-file = mmproj-BF16.gguf
# Prefill tuning.
batch-size = 4096
ubatch-size = 2048
threads-batch = 16
# DeltaNet recurrent-state checkpoints (PR #16382). Snapshots state every
# ~8K tokens so turn 2+ restores from the nearest snapshot instead of
# replaying the full context. 16 checkpoints × ~260 MiB = 4.1 GB VRAM
# (vs default 32 = 8.3 GB). If checkpoints are invalidated between turns,
# the cause is a shifting prompt prefix, not the checkpoint count.
ctx-checkpoints = 16
cache-idle-slots = true
# Route <think> tags to reasoning_content so clients that support it
# (pi) can render/filter them properly instead of showing raw tags.
# Ref: club-3090 issue #97.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-27b-mtp]
# Qwen3.6 27B MTP — official Unsloth GGUF with vision (mmproj).
# IQ4_NL quant with Q8_0 MTP layers baked in (no separate draft model).
# Includes mmproj-F16 (928 MB) for image input.
# MTP is upstream in llama.cpp master; the from-source Dockerfile build covers it.
# Ref: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
alias = qwen36-27b-mtp
model = /root/.cache/llama.cpp/Qwen3.6-27B-IQ4_NL.gguf
hf-repo = unsloth/Qwen3.6-27B-MTP-GGUF
hf-file = Qwen3.6-27B-IQ4_NL.gguf
mmproj = /root/.cache/llama.cpp/mmproj-27b-mtp-F16.gguf
mmproj-hf-file = mmproj-F16.gguf
no-mmproj-offload = true
# MTP speculative decoding (Unsloth 2026-05 recipe). Kept per-preset so
# non-MTP models in this file don't inherit these flags and fail to load.
spec-type = draft-mtp
spec-draft-n-max = 6
spec-draft-p-min = 0.75
# Prefill tuning. Qwen3.6's DeltaNet cannot reuse prefix cache across
# requests (llama.cpp issue #22746), so every prompt is reprocessed in
# full. Larger ubatch/batch makes that reprocess faster. The 3090 has
# enough VRAM headroom at ~21 GB model + Q4 KV cache.
batch-size = 4096
ubatch-size = 2048
threads-batch = 16
# DeltaNet recurrent-state checkpoints (PR #16382): snapshots recurrent
# state periodically so turn 2+ restores from the nearest checkpoint
# instead of replaying the full context (~200s at 104K tokens).
# Set to 16 (not the default 32) to save 4.2 GB VRAM — 16 × 260 MiB =
# 4.1 GB vs 32 × 260 MiB = 8.3 GB. Batch/ubatch bumped from 2048/1024
# to 4096/2048 using the freed headroom for faster full-reprocess prefill.
ctx-checkpoints = 16
cache-idle-slots = true
# Route <think> tags to reasoning_content — see qwen36-27b comment.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[nex-n2-mini]
# Nex-N2-mini by nex-agi — agentic fine-tune of Qwen3.5-35B-A3B
# (256 experts × 8 active, ~3B active params). qwen35moe arch.
# DeltaNet hybrid: 30 linear-attention + 10 full-attention layers
# (full_attention_interval=4) — same family as the qwen36-35b/27b presets.
# Ref:  https://huggingface.co/nex-agi/Nex-N2-mini
# GGUF: https://huggingface.co/bartowski/nex-agi_Nex-N2-mini-GGUF
#       (no official GGUF; bartowski imatrix quants, llama.cpp b9590)
#
# Quant: IQ4_XS (18.81 GB). With q4_0 KV and no mmproj this leaves ~3 GB
# headroom at 24 GB — lighter than the proven qwen36-35b-a3b-mtp profile
# (UD-Q4_K_XL ~19.5 GB).
#
# NO MTP: bartowski's b9590 converter predates qwen35moe MTP support, so
# the draft head was dropped (GGUF block_count=40, not 41). No community
# mini GGUF ships MTP. To get MTP, reconvert the 70 GB safetensors with
# current llama.cpp (bundles MTP by default) — needs ~140 GB peak disk.
#
# NO VISION: mmproj-F16 (0.9 GB) omitted to preserve headroom. There IS
# room to re-enable it: add `mmproj`, `mmproj-hf-file = mmproj-nex-agi_Nex-N2-mini-f16.gguf`,
# and `no-mmproj-offload = true`.
alias = nex-n2-mini
model = /root/.cache/llama.cpp/nex-agi_Nex-N2-mini-IQ4_XS.gguf
hf-repo = bartowski/nex-agi_Nex-N2-mini-GGUF
hf-file = nex-agi_Nex-N2-mini-IQ4_XS.gguf
# Prefill tuning — DeltaNet reprocesses every prompt in full (cannot reuse
# prefix cache, llama.cpp #22746), so larger ubatch speeds prefill. No MTP
# draft buffer means 4096/2048 fits comfortably.
batch-size = 4096
ubatch-size = 2048
threads-batch = 16
# Checkpoints at 16 — see qwen36-27b-mtp comment.
ctx-checkpoints = 16
cache-idle-slots = true
# Route <think> tags to reasoning_content so clients (pi) render them
# properly. Template supports enable_thinking (false = skip thinking by
# default, faster; pass enable_thinking=true per-request for hard tasks).
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
# Nex-N2 recommended sampling (README): temp 0.7, top-p 0.95, top-k 40.
temp = 0.7
top-p = 0.95
top-k = 40
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[ornith-35b]
# Ornith-1.0-35B by deepreinforce-ai — agentic-coding RL post-train of
# Qwen3.5-35B-A3B MoE. qwen3_5_moe arch, DeltaNet hybrid (30 linear +
# 10 full-attention layers, full_attention_interval=4) — same family
# as nex-n2-mini / qwen36-35b-a3b-mtp. Reasoning model (<think>), MIT.
# Ref:  https://huggingface.co/deepreinforce-ai/Ornith-1.0-35B
# GGUF: https://huggingface.co/deepreinforce-ai/Ornith-1.0-35B-GGUF
#
# Quant: Q4_K_M (21.17 GB) — the only quant that fits 24 GB (Q5_K_M is
# 24.7 GB). 2.36 GB heavier than nex-n2-mini (IQ4_XS 18.81 GB), so
# batch/ubatch trimmed to 1024/512 (vs nex's 4096/2048) to keep the
# compute pp buffer small enough for the heavier footprint.
#
# NO VISION: the GGUF repo ships no mmproj (base is image-text-to-text
# but the projector file isn't published), so this preset is text-only.
#
# NO MTP: base config has mtp_num_hidden_layers=1, but whether the GGUF
# converter baked the draft head in is unverified; spec flags left off.
alias = ornith-35b
model = /root/.cache/llama.cpp/ornith-1.0-35b-Q4_K_M.gguf
hf-repo = deepreinforce-ai/Ornith-1.0-35B-GGUF
hf-file = ornith-1.0-35b-Q4_K_M.gguf
# Prefill tuning — DeltaNet reprocesses every prompt in full (cannot
# reuse prefix cache, llama.cpp #22746). 1024/512 keeps the compute
# pp buffer small enough for the heavier 21 GB footprint.
batch-size = 1024
ubatch-size = 512
threads-batch = 16
# Checkpoints at 16 — cheap on this MoE arch (~1 GB) and speeds
# multi-turn by restoring recurrent state instead of full replay.
ctx-checkpoints = 16
cache-idle-slots = true
# Route <think> tags to reasoning_content — see qwen36-27b comment.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
# Ornith README recommended sampling (temp 0.6, top-p 0.95, top-k 20).
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1
