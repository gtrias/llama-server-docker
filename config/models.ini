[gemma4-26b]
# Unsloth re-quant with imatrix (2026-04-08) + llama.cpp Gemma 4 fixes (2026-04-07):
# - PR #21566: CUDA buffer overlap / unused24 token fix (CRITICAL)
# - PR #21513: KV-cache attention rotation for heterogeneous iSWA
# - PR #21488: Byte token handling for Gemma 4 BPE detokenizer
# - PR #21500: Set "add bos" = True for Gemma 4
# - PR #21418: Gemma 4 specialized parser
# - PR #21390: Read final_logit_softcapping for Gemma 4
# - PR #21406: Custom newline split for Gemma 4
# Ref: https://www.reddit.com/r/unsloth/s/osklMD4mtc
# Tool fix: Custom template outputs JSON tool calls instead of peg-gemma4 format
# to avoid array serialization bug (llama.cpp #21384)
alias = gemma4-26b
model = /root/.cache/llama.cpp/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
hf-repo = unsloth/gemma-4-26B-A4B-it-GGUF
hf-file = gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
chat-template-file = /config/gemma4-tool-fix.jinja
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 40
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

