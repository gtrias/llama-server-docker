# llama-server curated model presets
# Only models listed here should be exposed when models-dir discovery is disabled.
#
# Auto-download: Add hf-repo and hf-file to enable automatic downloading.
# The entrypoint will download missing models before starting the server.

[qwen35]
alias = qwen35
model = /root/.cache/llama.cpp/Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf
hf-repo = unsloth/Qwen3.5-35B-A3B-GGUF
hf-file = Qwen3.5-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /root/.cache/llama.cpp/mmproj-35b-BF16.gguf
mmproj-hf-file = mmproj-BF16.gguf
ctx-size = 122880
n-gpu-layers = -1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-p = 0.95
top-k = 20
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

