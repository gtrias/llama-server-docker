# llama-server curated model presets
# Only models listed here should be exposed when models-dir discovery is disabled.
#
# Auto-download: Add hf-repo and hf-file to enable automatic downloading.
# The entrypoint will download missing models before starting the server.

[gemma4-26b]
# Unsloth UD-Q4_K_M — April 11+ release with Google's updated chat template
# Native template handles tool calling correctly, no custom jinja needed
alias = gemma4-26b
model = /root/.cache/llama.cpp/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
hf-repo = unsloth/gemma-4-26B-A4B-it-GGUF
hf-file = gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 40
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[gemma4-31b]
# Unsloth Q4_K_M — April 11+ release, 20.1GB VRAM on RTX 3090
# Native template handles tool calling correctly, no custom jinja needed
alias = gemma4-31b
model = /root/.cache/llama.cpp/gemma-4-31B-it-Q4_K_M.gguf
hf-repo = unsloth/gemma-4-31B-it-GGUF
hf-file = gemma-4-31B-it-Q4_K_M.gguf
mmproj = /root/.cache/llama.cpp/mmproj-31b-BF16.gguf
mmproj-hf-file = mmproj-BF16.gguf
no-mmproj-offload = true
ctx-size = 65536
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 40
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-35b-a3b-mtp]
# Qwen3.6 35B-A3B MoE with MTP — 256 experts × 8 active (~3B active params).
# DeltaNet hybrid (3 DeltaNet + 1 standard attention per block, same as 27B).
# MTP head is baked into the GGUF, no separate drafter.
# Ref: https://unsloth.ai/docs/models/qwen3.6#llama.cpp-mtp-guide
# GGUF: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF
alias = qwen36-35b-a3b-mtp
model = /root/.cache/llama.cpp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
hf-repo = unsloth/Qwen3.6-35B-A3B-MTP-GGUF
hf-file = Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
mmproj = /root/.cache/llama.cpp/mmproj-35b-a3b-F16.gguf
mmproj-hf-file = mmproj-F16.gguf
no-mmproj-offload = true
# MTP speculative decoding (Unsloth 2026-05 recipe).
spec-type = draft-mtp
spec-draft-n-max = 6
spec-draft-p-min = 0.75
# Prefill tuning — smaller than dense models because MTP draft + 35B
# MoE weights leave little headroom for compute pp buffers (each MiB
# of ubatch ≈ ~1 MiB of CUDA0 compute buffer for the MTP draft).
# 4096/2048 OOMs the draft prefill at 24GB; 1024/512 fits.
batch-size = 1024
ubatch-size = 512
threads-batch = 16
# Route <think> tags to reasoning_content so clients that support it
# (pi) can render/filter them properly instead of showing raw tags.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
# VRAM on 24GB 3090: weights ~19.5 GB + MTP draft context + KV +
# mmproj + compute pp buffer (~2 GB) leaves no headroom above ~32k.
# Tried 65536 first → OOM at MTP draft context allocation. Bumping
# requires either dropping mmproj (no-mmproj-offload won't help — the
# OOM is on CUDA0 compute pp buffer for the draft) or switching quant
# to UD-Q2_K_XL (~11 GB).
ctx-size = 32768
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
# Unsloth "general tasks" sampler defaults. For reasoning/thinking mode,
# they recommend temp=1.0 top-p=0.95 instead.
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-27b]
# Qwen3.6 27B dense — DeltaNet architecture, vision+reasoning.
# Ref: https://huggingface.co/Qwen/Qwen3.6-27B
# GGUF: https://huggingface.co/unsloth/Qwen3.6-27B-GGUF
# Recommended settings: https://huggingface.co/Qwen/Qwen3.6-27B#best-practices
alias = qwen36-27b
model = /root/.cache/llama.cpp/Qwen3.6-27B-Q4_K_M.gguf
hf-repo = unsloth/Qwen3.6-27B-GGUF
hf-file = Qwen3.6-27B-Q4_K_M.gguf
mmproj = /root/.cache/llama.cpp/mmproj-27b-BF16.gguf
mmproj-hf-file = mmproj-BF16.gguf
# Prefill tuning.
batch-size = 4096
ubatch-size = 2048
threads-batch = 16
# DeltaNet checkpoint restore — see qwen36-27b-mtp comment for details.
ctx-checkpoints = 16
cache-idle-slots = false
# Route <think> tags to reasoning_content so clients that support it
# (pi) can render/filter them properly instead of showing raw tags.
# Ref: club-3090 issue #97.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-27b-q3kxl]
# Qwen3.6 27B dense — UD-Q3_K_XL (Unsloth dynamic 3-bit, ~14.5 GB).
# club-3090's recommended quant for max VRAM headroom: validated by
# Benjamin Marie's Kaitchup eval as the best quality/footprint balance
# for Qwen3.6. Saves ~2.3 GB vs Q4_K_M → bigger ubatch fits, faster
# DeltaNet full-reprocess.
# Ref: https://kaitchup.substack.com/p/summary-of-qwen36-gguf-evals-updating
# GGUF: https://huggingface.co/unsloth/Qwen3.6-27B-GGUF
alias = qwen36-27b-q3kxl
model = /root/.cache/llama.cpp/Qwen3.6-27B-UD-Q3_K_XL.gguf
hf-repo = unsloth/Qwen3.6-27B-GGUF
hf-file = Qwen3.6-27B-UD-Q3_K_XL.gguf
mmproj = /root/.cache/llama.cpp/mmproj-27b-BF16.gguf
mmproj-hf-file = mmproj-BF16.gguf
# With 2.3 GB freed, bump ubatch for faster DeltaNet full-reprocess.
batch-size = 8192
ubatch-size = 4096
threads-batch = 16
# DeltaNet checkpoint restore — see qwen36-27b-mtp comment for details.
ctx-checkpoints = 16
cache-idle-slots = false
# Route <think> tags to reasoning_content — see qwen36-27b comment.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1

[qwen36-27b-mtp]
# Qwen3.6 27B MTP — official Unsloth GGUF with vision (mmproj).
# UD-Q4_K_XL quant with Q8_0 MTP layers baked in (no separate draft model).
# Includes mmproj-F16 (928 MB) for image input.
# Requires llama.cpp built with PR #22673 (Dockerfile.mtp).
# Ref: https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF
alias = qwen36-27b-mtp
model = /root/.cache/llama.cpp/Qwen3.6-27B-UD-Q4_K_XL.gguf
hf-repo = unsloth/Qwen3.6-27B-MTP-GGUF
hf-file = Qwen3.6-27B-UD-Q4_K_XL.gguf
mmproj = /root/.cache/llama.cpp/mmproj-27b-mtp-F16.gguf
mmproj-hf-file = mmproj-F16.gguf
no-mmproj-offload = true
# MTP speculative decoding (Unsloth 2026-05 recipe). Kept per-preset so
# non-MTP models in this file don't inherit these flags and fail to load.
spec-type = draft-mtp
spec-draft-n-max = 6
spec-draft-p-min = 0.75
# Prefill tuning. Qwen3.6's DeltaNet cannot reuse prefix cache across
# requests (llama.cpp issue #22746), so every prompt is reprocessed in
# full. Larger ubatch/batch makes that reprocess faster. The 3090 has
# enough VRAM headroom at ~21 GB model + Q4 KV cache.
batch-size = 2048
ubatch-size = 1024
threads-batch = 16
# DeltaNet (recurrent) state checkpoint restore. PR #16382 added
# ctx-checkpoints for hybrid/recurrent models — snapshots recurrent
# state periodically so the server restores from the nearest checkpoint
# instead of reprocessing the full context on every turn. PR #22805
# (May 7 2026) fixed device state save/load for MTP speculative decoding.
# With parallel=1 the checkpoint VRAM cost is modest (~checkpoint_count ×
# recurrent-state-per-layer × n_layers_recurrent).
# Still keep cache-idle-slots=false — idle-slot serialization is a
# separate code path that may still crash for DeltaNet.
ctx-checkpoints = 16
cache-idle-slots = false
# Route <think> tags to reasoning_content — see qwen36-27b comment.
reasoning-format = deepseek
chat-template-kwargs = {"enable_thinking":false}
ctx-size = 131072
n-gpu-layers = -1
flash-attn = on
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
repeat-penalty = 1.0
parallel = 1
kv-unified = 1
