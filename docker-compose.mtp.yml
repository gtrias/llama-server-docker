# Override for the MTP-capable image build.
# Usage: docker compose -f docker-compose.yml -f docker-compose.mtp.yml up
#
# MTP-specific flags (spec-type, spec-draft-*) live per-preset in
# config/models.ini so they only apply to MTP-capable models. Other
# presets in the same file spawn without these flags and load fine.
services:
  llama-server:
    image: llama-server:mtp
